<!DOCTYPE html>
<html lang="id">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DicoStory - Aplikasi berbagi cerita dan peta persebaran kisah inspiratif nusantara." />
    <link rel="shortcut icon" href="/favicon.png" />
    <title>DicoStory - Berbagi Cerita Nusantara</title>

    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/images/icons/icon-192x192.png" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script type="module" src="/scripts/index.js"></script>
  </head>
  <body>
    <!-- Kriteria 4 (Advance): Fitur Skip to Content -->
    <a href="#main-content" class="skip-to-content">Menuju ke Konten Utama</a>

    <header class="app-header">
      <div class="main-header container">
        <a class="brand-name" href="#/" aria-label="DicoStory Beranda">
          <span class="brand-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg>
          </span>
          <span class="brand-text">Dico<span class="text-accent">Story</span></span>
        </a>

        <nav id="navigation-drawer" class="navigation-drawer" aria-label="Navigasi Utama">
          <ul id="nav-list" class="nav-list">
            <li><a href="#/" class="nav-link">Beranda</a></li>
            <li><a href="#/login" class="nav-link">Masuk</a></li>
            <li><a href="#/register" class="nav-link">Daftar</a></li>
            <li><a href="#/about" class="nav-link">Tentang</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button
            id="btn-open-diagnostics"
            class="btn btn-outline-secondary btn-sm btn-diagnostics"
            type="button"
            aria-label="Buka panel pengujian fitur dan diagnostik"
            title="Panel Uji Fitur & Diagnostik PWA"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><line x1="4" x2="4" y1="21" y2="14"></line><line x1="4" x2="4" y1="10" y2="3"></line><line x1="12" x2="12" y1="21" y2="12"></line><line x1="12" x2="12" y1="8" y2="3"></line><line x1="20" x2="20" y1="21" y2="16"></line><line x1="20" x2="20" y1="12" y2="3"></line><line x1="1" x2="7" y1="14" y2="14"></line><line x1="9" x2="15" y1="8" y2="8"></line><line x1="17" x2="23" y1="16" y2="16"></line></svg>
            <span class="diag-btn-text">Uji Fitur</span>
          </button>
          <button
            id="btn-install-pwa"
            class="btn btn-primary btn-sm btn-install-pwa hidden"
            type="button"
            aria-label="Pasang Aplikasi DicoStory ke Perangkat"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
            <span class="install-text">Pasang</span>
          </button>
          <button
            id="drawer-button"
            class="drawer-button"
            type="button"
            aria-label="Buka menu navigasi"
            aria-expanded="false"
            aria-controls="navigation-drawer"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg drawer-icon"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" class="main-content" tabindex="-1"></main>

    <footer class="app-footer">
      <div class="container footer-content">
        <p class="footer-copy">&copy; 2026 <strong>DicoStory</strong> &mdash; Dibuat untuk Submission Belajar Pengembangan Web Intermediate.</p>
        <p class="footer-links">
          <a href="#/about">Tentang Aplikasi</a> • 
          <a href="#/">Beranda</a>
        </p>
      </div>
    </footer>
  </body>
</html>
