    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/images/icons/icon-192x192.png" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <a href="#main-content" class="skip-to-content">Menuju ke Konten Utama</a>

    <header class="app-header">
      <div class="main-header container">
        <a class="brand-name" href="#/" aria-label="DicoStory Beranda">
          <span class="brand-icon" aria-hidden="true">📖</span>
          <span class="brand-text">Dico<span class="text-accent">Story</span></span>

        <nav id="navigation-drawer" class="navigation-drawer" aria-label="Navigasi Utama">

            type="button"
